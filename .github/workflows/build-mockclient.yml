name: Build MockClient

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build MockClient (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-14
          - platform: windows
            os: windows-2022

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            TournamentAssistantClient/package-lock.json
            MockClient/package-lock.json

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Verify mock certificate
        shell: bash
        run: test -f MockClient/static/mock.pfx

      - name: Build TournamentAssistantClient
        working-directory: TournamentAssistantClient
        run: |
          npm ci
          npm run build

      - name: Install MockClient dependencies
        working-directory: MockClient
        run: npm ci

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        working-directory: MockClient
        run: npm run tauri build -- --bundles appimage

      - name: Stage Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p artifacts
          appimage="$(find MockClient/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          cp "$appimage" artifacts/MockClient.AppImage
          chmod +x artifacts/MockClient.AppImage

      - name: Build macOS binary
        if: matrix.platform == 'macos'
        working-directory: MockClient
        run: npm run tauri build -- --no-bundle

      - name: Stage macOS binary
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p artifacts
          cp MockClient/src-tauri/target/release/ta-mock-client artifacts/MockClient
          chmod +x artifacts/MockClient

      - name: Build Windows executable
        if: matrix.platform == 'windows'
        working-directory: MockClient
        run: npm run tauri build -- --no-bundle

      - name: Stage Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item MockClient\src-tauri\target\release\ta-mock-client.exe artifacts\MockClient.exe

      - name: Upload platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: mockclient-part-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  collect:
    name: Collect MockClient binaries
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mockclient-part-*
          path: MockClient
          merge-multiple: true

      - name: Verify collected files
        shell: bash
        run: |
          test -f MockClient/MockClient.AppImage
          test -f MockClient/MockClient
          test -f MockClient/MockClient.exe

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: MockClient
          path: MockClient/*
          if-no-files-found: error
          retention-days: 30
